<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ткань</title>
<style>
  :root { --bg: #14161b; --fg: #ece8df; --dim: #8d8a94; --line: rgba(255,255,255,.1); --accent: #e9b872; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--fg); font: 13px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas.cut { cursor: crosshair; }
  #ui {
    position: fixed; top: 16px; left: 16px; padding: 12px 14px; width: 250px; max-width: calc(100vw - 32px);
    background: rgba(18, 20, 26, .8); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(6px); user-select: none;
  }
  #ui.hidden { display: none; }
  h1 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  p { margin: 0 0 8px; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  button { font: inherit; color: var(--fg); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.1); }
  button.on { border-color: var(--accent); color: var(--accent); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .row span { width: 72px; color: var(--dim); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  kbd { font: inherit; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }
  .keys { margin-top: 8px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Ткань</h1>
  <p>Тяните мышью. ПКМ или режим «ножницы» режет. Перетянутые нити рвутся сами.</p>
  <div class="chips">
    <button id="cutMode">✂ Ножницы</button>
    <button id="wind">Ветер</button>
    <button id="pins">Крепление: вся кромка</button>
    <button id="reset">Новая ткань</button>
  </div>
  <div class="row"><span>Прочность</span><input id="strength" type="range" min="15" max="80" value="35"></div>
  <div class="row"><span>Тяжесть</span><input id="gravity" type="range" min="0" max="100" value="45"></div>
  <div class="chips" id="patterns"></div>
  <div class="keys"><kbd>R</kbd> новая · <kbd>W</kbd> ветер · <kbd>X</kbd> ножницы · <kbd>H</kbd> скрыть</div>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let W, H, dpr;

  // Verlet cloth: each point remembers where it was last frame; velocity is implicit.
  let pts = [], links = [], quads = [], COLS, ROWS, GAP;
  let wind = false, cutMode = false, pinMode = 0;   // 0 = whole top edge, 1 = every 4th, 2 = two corners
  const PIN_NAMES = ['вся кромка', 'прищепки', 'два угла'];

  const PATTERNS = {
    'Шотландка': (c, r) => {
      const a = (Math.floor(c / 4) % 2), b = (Math.floor(r / 4) % 2), thin = c % 8 === 0 || r % 8 === 0;
      if (thin) return [232, 196, 104];
      return a && b ? [42, 64, 98] : a || b ? [120, 38, 44] : [158, 48, 52];
    },
    'Полосы':    (c, r) => (Math.floor(c / 3) % 2 ? [236, 230, 214] : [52, 84, 128]),
    'Горошек':   (c, r) => ((c % 6 - 3) ** 2 + (r % 6 - 3) ** 2 < 3 ? [246, 238, 220] : [196, 74, 64]),
    'Шёлк':      (c, r) => { const t = c / COLS; return [120 + 100 * t, 60 + 40 * Math.sin(r / 6), 160 - 60 * t]; },
  };
  let pattern = 'Шотландка';

  function build() {
    W = Math.max(320, innerWidth); H = Math.max(320, innerHeight);
    COLS = Math.max(24, Math.min(64, Math.round(W / 22)));
    GAP = Math.min((W * 0.7) / COLS, 18);
    ROWS = Math.max(16, Math.min(44, Math.round((H * 0.62) / GAP)));
    const x0 = (W - (COLS - 1) * GAP) / 2, y0 = Math.max(40, H * 0.08);
    pts = []; links = []; quads = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = x0 + c * GAP, y = y0 + r * GAP;
      const pinned = r === 0 && (pinMode === 0 || (pinMode === 1 && c % 4 === 0) || (pinMode === 2 && (c === 0 || c === COLS - 1)));
      pts.push({ x, y, px: x, py: y, pinned, ox: x, oy: y });
    }
    const id = (c, r) => r * COLS + c;
    const H_ = [], V_ = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1) { H_[id(c, r)] = links.length; links.push({ a: id(c, r), b: id(c + 1, r), rest: GAP, alive: true }); }
      if (r < ROWS - 1) { V_[id(c, r)] = links.length; links.push({ a: id(c, r), b: id(c, r + 1), rest: GAP, alive: true }); }
    }
    // a quad is drawn while all four of its edges hold
    for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++) {
      quads.push({ p: [id(c, r), id(c + 1, r), id(c + 1, r + 1), id(c, r + 1)], e: [H_[id(c, r)], V_[id(c + 1, r)], H_[id(c, r + 1)], V_[id(c, r)]], col: PATTERNS[pattern](c, r) });
    }
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  // ---------- input ----------
  const mouse = { x: 0, y: 0, px: 0, py: 0, down: false, cut: false, grab: null };
  function nearest(x, y, maxD) {
    let best = null, bd = maxD * maxD;
    for (const p of pts) { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = p; } }
    return best;
  }
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId);
    mouse.x = mouse.px = e.clientX; mouse.y = mouse.py = e.clientY; mouse.down = true;
    mouse.cut = e.button === 2 || cutMode || e.shiftKey;
    if (!mouse.cut) mouse.grab = nearest(e.clientX, e.clientY, 50);
  });
  cv.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  cv.addEventListener('pointerup', () => { mouse.down = false; mouse.grab = null; });

  // distance from point p to segment ab — the knife is a segment from last frame's cursor to this one
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    const t = l ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l)) : 0;
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  }

  // ---------- physics ----------
  let time = 0;
  function step() {
    time += 1;
    const g = +$('gravity').value / 100 * 0.6;
    const tear = +$('strength').value / 10;   // a link tears when stretched beyond this many rest lengths
    for (const p of pts) {
      if (p.pinned) continue;
      let vx = (p.x - p.px) * 0.99, vy = (p.y - p.py) * 0.99;
      let fx = 0, fy = g;
      if (wind) {
        // gusts: a slow travelling wave, stronger lower down
        const gust = 0.5 + 0.5 * Math.sin(time * 0.013 + p.y * 0.01) * Math.sin(time * 0.031 + p.x * 0.004);
        fx += 0.22 * gust; fy += 0.08 * Math.sin(time * 0.05 + p.x * 0.02) * gust;
      }
      p.px = p.x; p.py = p.y;
      p.x += vx + fx; p.y += vy + fy;
    }
    if (mouse.grab) { mouse.grab.x = mouse.x; mouse.grab.y = mouse.y; mouse.grab.px = mouse.x; mouse.grab.py = mouse.y; }

    for (let it = 0; it < 5; it++) {
      for (const l of links) {
        if (!l.alive) continue;
        const a = pts[l.a], b = pts[l.b];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.0001;
        if (d > l.rest * tear) { l.alive = false; continue; }
        // move both ends half way toward the rest length (pinned ends don't move)
        const diff = (d - l.rest) / d * 0.5;
        const ox = dx * diff, oy = dy * diff;
        const wa = a.pinned ? 0 : b.pinned ? 2 : 1, wb = b.pinned ? 0 : a.pinned ? 2 : 1;
        a.x += ox * wa; a.y += oy * wa; b.x -= ox * wb; b.y -= oy * wb;
      }
    }

    if (mouse.down && mouse.cut) {
      for (const l of links) {
        if (!l.alive) continue;
        const a = pts[l.a], b = pts[l.b];
        if (segDist((a.x + b.x) / 2, (a.y + b.y) / 2, mouse.px, mouse.py, mouse.x, mouse.y) < 7) l.alive = false;
      }
    }
    mouse.px = mouse.x; mouse.py = mouse.y;

    // pieces that fell far below the screen are gone for good
    for (const p of pts) if (p.y > H + 400 && !p.pinned) { p.y = H + 400; p.py = p.y; }
  }

  // ---------- drawing ----------
  function draw() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1d2028'); bg.addColorStop(1, '#101115');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // the rail the cloth hangs from
    const y0 = pts[0].oy;
    ctx.strokeStyle = '#5a5248'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0].ox - 30, y0 - 6); ctx.lineTo(pts[COLS - 1].ox + 30, y0 - 6); ctx.stroke();

    const rest = GAP * GAP;
    for (const q of quads) {
      if (!links[q.e[0]].alive || !links[q.e[1]].alive || !links[q.e[2]].alive || !links[q.e[3]].alive) continue;
      const [a, b, c, d] = q.p.map(i => pts[i]);
      // shade by area: bunched-up (folded) fabric is darker, taut fabric catches the light
      const area = Math.abs((c.x - a.x) * (d.y - b.y) - (d.x - b.x) * (c.y - a.y)) / 2;
      const slope = ((b.y - a.y) + (c.y - d.y)) / (2 * GAP);   // tilt across the weave
      const k = Math.max(0.35, Math.min(1.25, 0.45 + 0.55 * Math.min(1, area / rest) + slope * 0.35));
      const col = q.col;
      ctx.fillStyle = `rgb(${col[0] * k | 0},${col[1] * k | 0},${col[2] * k | 0})`;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 0.7; ctx.stroke();   // hides hairline seams between quads
    }
    // loose threads: links still alive but without a drawn quad on either side
    ctx.strokeStyle = 'rgba(230,220,200,.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const l of links) if (l.alive && l.orphan) { const a = pts[l.a], b = pts[l.b]; ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
    ctx.stroke();

    // pins
    ctx.fillStyle = '#c9b48a';
    for (const p of pts) if (p.pinned) { ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); ctx.fill(); }

    if (cutMode || (mouse.down && mouse.cut)) {
      ctx.strokeStyle = 'rgba(255,120,100,.7)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 7, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function markOrphans() {
    const used = new Uint8Array(links.length);
    for (const q of quads) {
      if (q.e.every(i => links[i].alive)) for (const i of q.e) used[i] = 1;
    }
    links.forEach((l, i) => l.orphan = !used[i]);
  }

  function loop() {
    requestAnimationFrame(loop);
    step(); step();          // two physics substeps per frame: stiffer, steadier cloth
    if (time % 8 === 0) markOrphans();
    draw();
  }

  // ---------- UI ----------
  function setCut(v) { cutMode = v; $('cutMode').classList.toggle('on', v); cv.classList.toggle('cut', v); }
  function setWind(v) { wind = v; $('wind').classList.toggle('on', v); }
  $('cutMode').onclick = () => setCut(!cutMode);
  $('wind').onclick = () => setWind(!wind);
  $('pins').onclick = () => { pinMode = (pinMode + 1) % 3; $('pins').textContent = 'Крепление: ' + PIN_NAMES[pinMode]; build(); };
  $('reset').onclick = build;
  for (const name of Object.keys(PATTERNS)) {
    const b = document.createElement('button'); b.textContent = name;
    b.onclick = () => { pattern = name; [...$('patterns').children].forEach(x => x.classList.toggle('on', x === b)); build(); };
    if (name === pattern) b.classList.add('on');
    $('patterns').append(b);
  }
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'r' || k === 'к') build();
    else if (k === 'w' || k === 'ц') setWind(!wind);
    else if (k === 'x' || k === 'ч') setCut(!cutMode);
    else if (k === 'h' || k === 'р') $('ui').classList.toggle('hidden');
  });
  addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });

  window.__cloth = { get pts() { return pts; }, get links() { return links; }, step, build, mouse, setWind };

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
