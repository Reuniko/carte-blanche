<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ночной город</title>
<style>
  :root { --bg: #070912; --fg: #e4e2ee; --dim: #8a8aa0; --line: rgba(255,255,255,.1); --accent: #ffcf7a; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--fg); font: 13px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
  #ui {
    position: fixed; right: 16px; bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
    max-width: calc(100vw - 32px); opacity: .35; transition: opacity .3s;
  }
  #ui:hover { opacity: 1; }
  button { font: inherit; color: var(--fg); background: rgba(10,12,22,.7); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; backdrop-filter: blur(4px); }
  button.on { border-color: var(--accent); color: var(--accent); }
  #hint { position: fixed; left: 16px; bottom: 16px; color: var(--dim); font-size: 12px; opacity: .6; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Кликните по окну, чтобы включить или выключить свет</div>
<div id="ui">
  <button id="rain" class="on">Дождь</button>
  <button id="train">Поезд</button>
  <button id="speed">Скорость: обычная</button>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let W, H, dpr, groundY;

  // tiny seeded RNG so a building looks the same every time it scrolls back into view
  function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

  // Three parallax layers: far ones move slower, are hazier and have smaller windows.
  const LAYERS = [
    { speed: 0.18, h: [0.18, 0.42], w: [40, 90], win: 4, color: [22, 26, 48], haze: 0.55, lit: 0.18, seed: 11 },
    { speed: 0.45, h: [0.22, 0.55], w: [50, 110], win: 5, color: [16, 18, 34], haze: 0.25, lit: 0.26, seed: 23 },
    { speed: 1.0,  h: [0.25, 0.62], w: [70, 140], win: 7, color: [10, 11, 20], haze: 0.0, lit: 0.32, seed: 37 },
  ];
  const cache = LAYERS.map(() => new Map());   // building index -> building

  function building(li, i) {
    const m = cache[li];
    if (m.has(i)) return m.get(i);
    const L = LAYERS[li], r = rng(L.seed * 100003 + i * 7919);
    const w = L.w[0] + r() * (L.w[1] - L.w[0]);
    const b = {
      w, gap: 4 + r() * 18, h: (L.h[0] + r() * (L.h[1] - L.h[0])),
      cols: Math.max(2, Math.floor((w - 10) / (L.win * 2.2))), roof: r(),
      warm: r() < 0.7, antenna: r() < 0.35, tank: r() < 0.25, seed: r() * 1e9,
      lit: null,
    };
    m.set(i, b);
    if (m.size > 400) m.delete(m.keys().next().value);
    return b;
  }
  // x position of building i in its layer's world space (prefix sums, cached)
  const starts = LAYERS.map(() => [0]);
  function startOf(li, i) {
    const s = starts[li];
    while (s.length <= i) { const k = s.length - 1, b = building(li, k); s.push(s[k] + b.w + b.gap); }
    return s[i];
  }
  function firstVisible(li, x) {   // binary search over prefix sums
    startOf(li, 0);
    while (starts[li][starts[li].length - 1] < x + 10) startOf(li, starts[li].length);
    let lo = 0, hi = starts[li].length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (starts[li][mid] <= x) lo = mid; else hi = mid - 1; }
    return lo;
  }

  let stars = [], drops = [], splashes = [];
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = Math.max(320, innerWidth); H = Math.max(320, innerHeight);
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = Math.round(H * 0.8);
    const r = rng(5);
    stars = Array.from({ length: Math.round(W * H / 5000) }, () => ({ x: r() * W, y: r() * groundY * 0.7, s: r() * 1.3 + 0.2, ph: r() * 6.28 }));
    drops = Array.from({ length: Math.round(W / 3) }, () => newDrop(true));
  }
  function newDrop(anywhere) { return { x: Math.random() * (W + 200) - 100, y: anywhere ? Math.random() * H : -20, v: 9 + Math.random() * 6, l: 10 + Math.random() * 14 }; }

  // ---------- state ----------
  let cam = 0, t = 0, rain = true, speedIdx = 1, flash = 0;
  const SPEEDS = [[0.15, 'медленная'], [0.5, 'обычная'], [1.6, 'быстрая']];
  let train = null, nextTrain = 600;
  const toggled = new Map();   // "layer:building:window" -> forced state from clicks

  function windowLit(li, bi, b, idx) {
    const key = li + ':' + bi + ':' + idx;
    if (toggled.has(key)) return toggled.get(key);
    // each window has its own slow on/off rhythm, so the city quietly changes over time
    const r = rng(b.seed + idx * 31)();
    const period = 900 + r * 2400;
    const phase = Math.sin((t / period + r * 13) * 6.283);
    return r < LAYERS[li].lit * 1.6 && phase > -0.2 + r * 0.4;
  }

  // ---------- drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#05060d'); g.addColorStop(0.6, '#121630'); g.addColorStop(1, '#2a2440');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY);
    for (const s of stars) {
      const a = (rain ? 0.25 : 0.7) * (0.6 + 0.4 * Math.sin(t * 0.02 + s.ph));
      ctx.fillStyle = `rgba(230,230,255,${a})`; ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    // moon, softened by cloud when raining
    const mx = W * 0.78, my = groundY * 0.22;
    const mg = ctx.createRadialGradient(mx, my, 0, mx, my, 120);
    mg.addColorStop(0, `rgba(255,244,214,${rain ? 0.18 : 0.3})`); mg.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - 120, my - 120, 240, 240);
    ctx.fillStyle = rain ? 'rgba(240,232,210,.55)' : '#f4ead2';
    ctx.beginPath(); ctx.arc(mx, my, 26, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(200,190,170,.25)';
    ctx.beginPath(); ctx.arc(mx - 8, my - 5, 5, 0, 6.283); ctx.arc(mx + 7, my + 8, 3.5, 0, 6.283); ctx.fill();
  }

  const hit = [];   // window rectangles of the front layer, for clicks
  function drawLayer(li) {
    const L = LAYERS[li], off = cam * L.speed;
    let i = firstVisible(li, off);
    if (li === 2) hit.length = 0;
    for (;;) {
      const b = building(li, i), x = startOf(li, i) - off;
      if (x > W) break;
      const bh = b.h * groundY, y = groundY - bh;
      const [cr, cg, cb] = L.color;
      ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
      ctx.fillRect(x, y, b.w, bh);
      // roof shapes
      if (b.roof < 0.25) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + b.w / 2, y - b.w * 0.18); ctx.lineTo(x + b.w, y); ctx.fill(); }
      else if (b.roof < 0.45) ctx.fillRect(x + b.w * 0.25, y - 10, b.w * 0.5, 10);
      if (b.tank && li > 0) { ctx.fillRect(x + b.w * 0.65, y - 16, 12, 12); ctx.fillRect(x + b.w * 0.65 + 2, y - 4, 2, 4); ctx.fillRect(x + b.w * 0.65 + 8, y - 4, 2, 4); }
      if (b.antenna) {
        ctx.fillRect(x + b.w * 0.3, y - 34, 2, 34);
        if (Math.sin(t * 0.05 + b.seed) > 0.6) {   // blinking aircraft warning light
          ctx.fillStyle = 'rgba(255,60,60,.9)'; ctx.beginPath(); ctx.arc(x + b.w * 0.3 + 1, y - 35, 2.2, 0, 6.283); ctx.fill();
        }
      }
      // windows
      const ws = L.win, cols = b.cols, padX = (b.w - cols * ws * 2.2 + ws * 1.2) / 2;
      const rows = Math.floor((bh - 14) / (ws * 2.4));
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const idx = r * cols + c, wx = x + padX + c * ws * 2.2, wy = y + 10 + r * ws * 2.4;
        const on = windowLit(li, i, b, idx);
        if (on) {
          const tint = rng(b.seed + idx)();
          ctx.fillStyle = b.warm ? `rgba(255,${200 + tint * 40 | 0},${110 + tint * 60 | 0},${0.85 - L.haze * 0.4})` : `rgba(${170 + tint * 50 | 0},210,255,${0.75 - L.haze * 0.4})`;
        } else ctx.fillStyle = `rgba(${cr + 14},${cg + 14},${cb + 22},1)`;
        ctx.fillRect(wx, wy, ws, ws * 1.3);
        if (li === 2) hit.push([wx, wy, ws, ws * 1.3, i, idx]);
      }
      i++;
    }
    // haze over far layers
    if (L.haze) {
      const g = ctx.createLinearGradient(0, groundY * 0.35, 0, groundY);
      g.addColorStop(0, 'rgba(42,36,64,0)'); g.addColorStop(1, `rgba(42,36,64,${L.haze})`);
      ctx.fillStyle = g; ctx.fillRect(0, groundY * 0.35, W, groundY * 0.65);
    }
  }

  function drawTrain() {
    const ty = groundY - H * 0.12;
    // elevated track
    ctx.fillStyle = '#0b0c16'; ctx.fillRect(0, ty + 14, W, 5);
    const pillarOff = (cam * 1.0) % 120;
    for (let x = -pillarOff; x < W; x += 120) ctx.fillRect(x, ty + 19, 6, groundY - ty - 19);
    if (!train) return;
    const cars = 6, carW = 120;
    for (let k = 0; k < cars; k++) {
      const x = train.x + k * (carW + 6);
      if (x > W || x + carW < 0) continue;
      ctx.fillStyle = '#1a1d2e'; ctx.fillRect(x, ty - 14, carW, 28);
      ctx.fillStyle = 'rgba(255,236,190,.85)';
      for (let w = 0; w < 7; w++) ctx.fillRect(x + 8 + w * 16, ty - 8, 10, 10);
      // light spilling down from the windows
      const g = ctx.createLinearGradient(0, ty + 14, 0, ty + 60);
      g.addColorStop(0, 'rgba(255,230,180,.12)'); g.addColorStop(1, 'rgba(255,230,180,0)');
      ctx.fillStyle = g; ctx.fillRect(x, ty + 14, carW, 46);
    }
    // headlight
    const hx = train.dir > 0 ? train.x + cars * (carW + 6) : train.x;
    const hg = ctx.createRadialGradient(hx, ty, 0, hx, ty, 90);
    hg.addColorStop(0, 'rgba(255,250,220,.6)'); hg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = hg; ctx.fillRect(hx - 90, ty - 90, 180, 180);
  }

  function drawStreet() {
    ctx.fillStyle = '#0a0b12'; ctx.fillRect(0, groundY, W, H - groundY);
    // street lamps on the front layer's scroll
    const spacing = 220, off = cam % spacing;
    for (let x = -off; x < W + spacing; x += spacing) {
      ctx.fillStyle = '#15161f'; ctx.fillRect(x, groundY - 70, 3, 70); ctx.fillRect(x, groundY - 70, 16, 3);
      const g = ctx.createRadialGradient(x + 15, groundY - 66, 0, x + 15, groundY - 66, 80);
      g.addColorStop(0, 'rgba(255,200,120,.45)'); g.addColorStop(1, 'rgba(255,200,120,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x + 15, groundY - 66, 80, 0, 6.283); ctx.fill();
    }
  }

  // wet street: mirror the band above the ground line, rippled row by row
  function drawReflection() {
    const band = Math.min(H - groundY, groundY * 0.5);
    ctx.save();
    ctx.globalAlpha = rain ? 0.32 : 0.22;
    for (let y = 0; y < band; y += 2) {
      const srcY = groundY - y - 2;
      const wob = Math.sin(y * 0.25 + t * 0.08) * (1 + y * 0.04) * (rain ? 1.6 : 0.6);
      ctx.drawImage(cv, 0, srcY * dpr, W * dpr, 2 * dpr, wob, groundY + y, W, 2);
    }
    ctx.restore();
    const g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, 'rgba(10,11,18,0)'); g.addColorStop(1, 'rgba(10,11,18,.85)');
    ctx.fillStyle = g; ctx.fillRect(0, groundY, W, H - groundY);
  }

  function drawRain() {
    ctx.strokeStyle = 'rgba(170,190,230,.32)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const d of drops) {
      d.x -= d.v * 0.18; d.y += d.v;
      ctx.moveTo(d.x, d.y); ctx.lineTo(d.x + d.l * 0.18, d.y - d.l);
      if (d.y > groundY + Math.random() * (H - groundY)) {
        if (splashes.length < 200) splashes.push({ x: d.x, y: d.y, life: 12 });
        Object.assign(d, newDrop(false));
      }
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(190,205,240,.35)';
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i], k = 1 - s.life / 12;
      ctx.beginPath(); ctx.ellipse(s.x, s.y, 2 + k * 7, 0.8 + k * 2, 0, Math.PI, 0); ctx.stroke();
      if (--s.life <= 0) splashes.splice(i, 1);
    }
  }

  function frame() {
    requestAnimationFrame(frame);
    t++;
    cam += SPEEDS[speedIdx][0];
    if (--nextTrain <= 0 && !train) startTrain();
    if (train) {
      train.x += train.dir * 4.2;
      if ((train.dir > 0 && train.x > W + 50) || (train.dir < 0 && train.x < -6 * 126 - 50)) { train = null; nextTrain = 900 + Math.random() * 1200; }
    }
    if (rain && Math.random() < 0.0006) flash = 1;

    drawSky();
    drawLayer(0); drawLayer(1);
    drawTrain();
    drawLayer(2);
    drawStreet();
    drawReflection();
    if (rain) drawRain();
    if (flash > 0) { ctx.fillStyle = `rgba(200,210,255,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - 0.06); }
  }
  function startTrain() { const dir = Math.random() < 0.5 ? 1 : -1; train = { dir, x: dir > 0 ? -6 * 126 : W }; }

  cv.addEventListener('click', e => {
    for (const [x, y, w, h, bi, idx] of hit) {
      if (e.clientX >= x - 2 && e.clientX <= x + w + 2 && e.clientY >= y - 2 && e.clientY <= y + h + 2) {
        const key = '2:' + bi + ':' + idx, b = building(2, bi);
        toggled.set(key, !windowLit(2, bi, b, idx));
        return;
      }
    }
  });
  $('rain').onclick = () => { rain = !rain; $('rain').classList.toggle('on', rain); };
  $('train').onclick = () => { if (!train) startTrain(); };
  $('speed').onclick = () => { speedIdx = (speedIdx + 1) % 3; $('speed').textContent = 'Скорость: ' + SPEEDS[speedIdx][1]; };
  addEventListener('resize', resize);

  resize();
  nextTrain = 240;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
