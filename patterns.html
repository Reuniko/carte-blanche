<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Узоры</title>
<style>
  :root { --bg: #07080c; --fg: #e8e6f0; --dim: #8a879a; --line: rgba(255,255,255,.1); --accent: #ffcf7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--fg); font: 13px/1.5 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }
  #ui {
    position: fixed; top: 16px; left: 16px; width: 270px; max-width: calc(100vw - 32px); padding: 12px 14px;
    background: rgba(10, 11, 18, .78); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(8px);
    user-select: none; max-height: calc(100vh - 32px); overflow-y: auto;
  }
  #ui.hidden { display: none; }
  h1 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  .sub { margin: 0 0 10px; color: var(--dim); }
  .label { margin: 10px 0 5px; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  button {
    font: inherit; color: var(--fg); background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 9px; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,.1); }
  button.on { border-color: var(--accent); color: var(--accent); }
  .sw { width: 30px; height: 20px; padding: 0; border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .row span { width: 70px; color: var(--dim); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .keys { margin-top: 10px; color: var(--dim); font-size: 12px; }
  kbd { font: inherit; color: var(--fg); padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; }
  #params { margin-top: 8px; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  #axis { position: fixed; inset: 0; pointer-events: none; display: none; color: rgba(255,255,255,.75); font-size: 12px; text-shadow: 0 1px 3px #000; }
  #axis.on { display: block; }
  #axis .x { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); }
  #axis .y { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) rotate(-90deg); transform-origin: right center; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="axis"><div class="x">k (скорость убывания) →</div><div class="y">F (подпитка) →</div></div>
<div id="err">Этому браузеру не хватает WebGL2 с float-текстурами, без них узоры не растут.</div>
<div id="ui">
  <h1>Узоры</h1>
  <p class="sub">Реакция-диффузия Грея — Скотта. Рисуйте мышью, ПКМ стирает.</p>

  <div class="label">Режим</div>
  <div class="chips" id="presets"></div>

  <div class="label">Палитра</div>
  <div class="chips" id="palettes"></div>

  <div class="row"><span>Скорость</span><input id="speed" type="range" min="1" max="40" value="16"></div>
  <div class="row"><span>Кисть</span><input id="brush" type="range" min="2" max="60" value="12"></div>
  <div class="chips" style="margin-top:10px">
    <button id="seed">Посеять</button><button id="clear">Очистить</button><button id="save">Сохранить PNG</button>
  </div>
  <div id="params"></div>
  <div class="keys"><kbd>Пробел</kbd> пауза · <kbd>1</kbd>–<kbd>7</kbd> режимы · <kbd>R</kbd> посеять · <kbd>C</kbd> очистить · <kbd>H</kbd> скрыть</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const $ = id => document.getElementById(id);
  const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
  if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
    $('err').style.display = 'flex'; $('ui').style.display = 'none'; return;
  }

  // F = feed rate, k = kill rate. Tiny changes in these two numbers give completely different worlds.
  const PRESETS = [
    { name: 'Кораллы',  F: 0.0545, k: 0.062 },
    { name: 'Митоз',    F: 0.0367, k: 0.0649 },
    { name: 'Лабиринт', F: 0.029,  k: 0.057 },
    { name: 'Пятна',    F: 0.035,  k: 0.065 },
    { name: 'Черви',    F: 0.078,  k: 0.061 },
    { name: 'Волны',    F: 0.014,  k: 0.045 },
    { name: 'Карта F/k', map: true },
  ];
  const PALETTES = [
    { name: 'Риф',    c: ['#0b1026', '#1b5e7a', '#3fb8af', '#f5e6b8', '#ff6f59'] },
    { name: 'Магма',  c: ['#07030a', '#3b0f4f', '#b5345a', '#f98e4c', '#fcf5b8'] },
    { name: 'Тушь',   c: ['#f4efe6', '#d8cfc0', '#7d7466', '#2c2925', '#0f0e0d'] },
    { name: 'Мох',    c: ['#0c140c', '#20391f', '#4f7a33', '#a7c957', '#f2e8cf'] },
    { name: 'Лёд',    c: ['#04070f', '#10264a', '#3d6fb6', '#9fd3ff', '#ffffff'] },
  ];

  // ---------- shaders ----------
  const VS = `#version 300 es
  const vec2 P[3] = vec2[](vec2(-1,-1), vec2(3,-1), vec2(-1,3));
  out vec2 uv;
  void main() { vec2 p = P[gl_VertexID]; uv = p * .5 + .5; gl_Position = vec4(p, 0, 1); }`;

  const INIT = `#version 300 es
  precision highp float;
  out vec4 o;
  uniform float seed; uniform int mode;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7)) + seed) * 43758.5453); }
  void main() {
    vec2 u = vec2(1, 0);
    if (mode == 1) {
      vec2 cell = floor(gl_FragCoord.xy / 28.);
      vec2 c = (cell + .5 + (vec2(hash(cell + 3.1), hash(cell + 7.7)) - .5) * .6) * 28.;
      if (hash(cell) > .86 && length(gl_FragCoord.xy - c) < 4. + 4. * hash(cell + 1.3)) u = vec2(.5, .25);
    }
    o = vec4(u, 0, 1);
  }`;

  const SIM = `#version 300 es
  precision highp float;
  out vec4 o;
  uniform sampler2D s; uniform vec2 res; uniform float F, K; uniform bool mapMode;
  uniform vec4 brush;   // xy = position (sim px), z = radius, w = +1 paint / -1 erase / 0 none
  void main() {
    ivec2 p = ivec2(gl_FragCoord.xy), R = ivec2(res);
    #define T(dx, dy) texelFetch(s, (p + ivec2(dx, dy) + R) % R, 0).xy
    vec2 c = T(0, 0);
    // 3x3 Laplacian: how much this cell differs from its neighbours
    vec2 lap = .2 * (T(1,0) + T(-1,0) + T(0,1) + T(0,-1))
             + .05 * (T(1,1) + T(-1,1) + T(1,-1) + T(-1,-1)) - c;
    float f = F, k = K;
    if (mapMode) { vec2 q = gl_FragCoord.xy / res; k = mix(.05, .07, q.x); f = mix(.008, .085, q.y); }
    float u = c.x, v = c.y, uvv = u * v * v;
    u += 1.0 * lap.x - uvv + f * (1. - u);   // U diffuses fast, is eaten by V, is replenished
    v += 0.5 * lap.y + uvv - (k + f) * v;    // V diffuses slower, grows by eating U, decays
    if (brush.w != 0. && length(gl_FragCoord.xy - brush.xy) < brush.z) {
      if (brush.w > 0.) { u = .5; v = .25; } else { u = 1.; v = 0.; }
    }
    o = vec4(clamp(u, 0., 1.), clamp(v, 0., 1.), 0, 1);
  }`;

  const DRAW = `#version 300 es
  precision highp float;
  in vec2 uv; out vec4 o;
  uniform sampler2D s; uniform vec2 res; uniform vec3 pal[5];
  float V(vec2 q) {
    // manual bilinear + wrap: float textures can't be linearly filtered everywhere
    q -= .5; vec2 f = fract(q); ivec2 i = ivec2(floor(q)), R = ivec2(res);
    float a = texelFetch(s, (i + R) % R, 0).y,             b = texelFetch(s, (i + ivec2(1,0) + R) % R, 0).y;
    float c = texelFetch(s, (i + ivec2(0,1) + R) % R, 0).y, d = texelFetch(s, (i + ivec2(1,1) + R) % R, 0).y;
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }
  vec3 palette(float t) {
    t = clamp(t, 0., 1.) * 4.;
    int i = int(min(floor(t), 3.));
    return mix(pal[i], pal[i + 1], smoothstep(0., 1., t - float(i)));
  }
  void main() {
    vec2 p = uv * res;
    float v = V(p);
    // treat V as a height field and light it, for a slightly embossed look
    vec2 g = vec2(V(p + vec2(1, 0)) - V(p - vec2(1, 0)), V(p + vec2(0, 1)) - V(p - vec2(0, 1)));
    vec3 n = normalize(vec3(-g * 6., 1.));
    vec3 L = normalize(vec3(-.5, .6, .8));
    float diff = dot(n, L), spec = pow(max(dot(reflect(-L, n), vec3(0, 0, 1)), 0.), 24.);
    vec3 col = palette(smoothstep(0., .42, v)) * (.78 + .32 * diff) + spec * .18;
    o = vec4(col, 1);
  }`;

  function compile(type, src) {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  function program(fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[name] = gl.getUniformLocation(p, name.includes('pal') ? 'pal' : name); }
    return { p, u };
  }
  const P = { init: program(INIT), sim: program(SIM), draw: program(DRAW) };
  gl.bindVertexArray(gl.createVertexArray());   // fullscreen triangle needs no attributes

  // ---------- ping-pong state ----------
  const SCALE = 0.5;   // sim cells per CSS pixel
  let SW, SH, tex = [], fbo = [], cur = 0;
  function makeTarget() {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, SW, SH, 0, gl.RGBA, gl.FLOAT, null);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    return [t, f];
  }
  function reset(mode) {
    gl.useProgram(P.init.p);
    gl.uniform1f(P.init.u.seed, Math.random() * 100);
    gl.uniform1i(P.init.u.mode, mode);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[cur]);
    gl.viewport(0, 0, SW, SH);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    SW = Math.max(64, Math.round(innerWidth * SCALE)); SH = Math.max(64, Math.round(innerHeight * SCALE));
    tex.forEach(t => gl.deleteTexture(t)); fbo.forEach(f => gl.deleteFramebuffer(f));
    [[tex[0], fbo[0]], [tex[1], fbo[1]]] = [makeTarget(), makeTarget()];
    cur = 0; reset(1);
  }

  // ---------- state & UI ----------
  let preset = PRESETS[0], palette = PALETTES[0], paused = false;
  const brush = { x: 0, y: 0, mode: 0 };

  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
  function setPreset(i) {
    preset = PRESETS[i];
    [...$('presets').children].forEach((b, j) => b.classList.toggle('on', j === i));
    $('axis').classList.toggle('on', !!preset.map);
    $('params').textContent = preset.map ? 'Слева направо растёт k, снизу вверх растёт F' : `F = ${preset.F} · k = ${preset.k}`;
    if (preset.map) reset(1);
  }
  function setPalette(i) {
    palette = PALETTES[i];
    [...$('palettes').children].forEach((b, j) => b.classList.toggle('on', j === i));
  }
  PRESETS.forEach((p, i) => { const b = document.createElement('button'); b.textContent = p.name; b.onclick = () => setPreset(i); $('presets').append(b); });
  PALETTES.forEach((p, i) => {
    const b = document.createElement('button'); b.className = 'sw'; b.title = p.name;
    b.style.background = `linear-gradient(90deg, ${p.c.join(',')})`; b.onclick = () => setPalette(i); $('palettes').append(b);
  });
  $('seed').onclick = () => reset(1);
  $('clear').onclick = () => reset(0);
  $('save').onclick = () => {
    const a = document.createElement('a');
    a.download = `uzor-${preset.name}-${Date.now()}.png`.replace(/[\s/]/g, '-');
    a.href = canvas.toDataURL('image/png'); a.click();
  };

  function toSim(e) { brush.x = e.clientX * SCALE; brush.y = (innerHeight - e.clientY) * SCALE; }
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); toSim(e); brush.mode = e.button === 2 ? -1 : 1; });
  canvas.addEventListener('pointermove', e => toSim(e));
  canvas.addEventListener('pointerup', () => { brush.mode = 0; });
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === ' ') { paused = !paused; e.preventDefault(); }
    else if (k >= '1' && k <= String(PRESETS.length)) setPreset(+k - 1);
    else if (k === 'r' || k === 'к') reset(1);
    else if (k === 'c' || k === 'с') reset(0);
    else if (k === 'h' || k === 'р') $('ui').classList.toggle('hidden');
  });
  addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(resize, 150); });

  // ---------- loop ----------
  function step() {
    gl.useProgram(P.sim.p);
    const u = P.sim.u;
    gl.uniform2f(u.res, SW, SH);
    gl.uniform1f(u.F, preset.F || 0); gl.uniform1f(u.K, preset.k || 0);
    gl.uniform1i(u.mapMode, preset.map ? 1 : 0);
    gl.uniform4f(u.brush, brush.x, brush.y, +$('brush').value * SCALE, brush.mode);
    gl.uniform1i(u.s, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[1 - cur]);
    gl.viewport(0, 0, SW, SH);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    cur = 1 - cur;
  }
  function draw() {
    gl.useProgram(P.draw.p);
    gl.uniform2f(P.draw.u.res, SW, SH);
    gl.uniform3fv(P.draw.u.pal, palette.c.flatMap(hexToRgb));
    gl.uniform1i(P.draw.u.s, 0);
    gl.bindTexture(gl.TEXTURE_2D, tex[cur]);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function loop() {
    if (!paused) { const n = +$('speed').value; for (let i = 0; i < n; i++) step(); }
    else if (brush.mode) step();   // still let people paint while paused
    draw();
    requestAnimationFrame(loop);
  }

  resize(); setPreset(0); setPalette(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
